name: Validar CardioIA
on: [push, pull_request]
jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/gerar_evidencias.py
      - run: python scripts/executar_notebooks.py
      - run: python -m pytest -q
      - run: python scripts/verificar_entrega.py --extras
